storage:
  - id: emmc
    type: emmc
    size: 137438953472           # 128 GiB
    sector-size: 512
    write-protect-boundary: 0

# SoC part of contents.xml: chip identity and boot-chain firmware.
contents:
  chip: SHIKRA
  additional-chipids: [CQ2390, CQ2390M, CQ2390S, IQ2390S]
  common:
    - device-programmer: {file: prog_firehose_ddr.elf}
    - device-programmer: {file: prog_firehose_lite.elf, attributes: {firehose_type: "lite"}}
