#
# One physical board, two alternative boot-storage flavors: the Kodiak
# per-LUN UFS layout and the Kodiak eMMC layout. The board contributes
# the storage geometry.
platform:
  name: qcm6490-idp

storage:
  - id: ufs
    size: 137438953472
    sector-size: 4096
    write-protect-boundary: 0
    grow-last-partition: true
  - id: emmc
    size: 137438953472
    sector-size: 512
    write-protect-boundary: 65536
    grow-last-partition: true

contents:
  product-name: QCM6490.LE.0.0
  hlos-type: LE
  chip: QCM6490
  additional-chipids: [SM7325, QCS6490]
  common:
    - device-programmer: {file: prog_firehose_ddr.elf}
    - device-programmer: {file: prog_firehose_lite.elf, attributes: {firehose_type: "lite"}}

flavors:
  - layout: flavors/kodiak-ufs.yaml
  - layout: flavors/kodiak-emmc.yaml
