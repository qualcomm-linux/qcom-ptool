#
# Composes the shared Kodiak partition sets from _common/ into the two
# alternative boot-storage layouts: the per-LUN UFS layout and the eMMC
# layout (user area plus the cdt boot area). On eMMC the rootfs and cdt
# sizes differ from the UFS layout and are overridden in place.
platform:
  name: qcm6490-idp

storage:
  - id: ufs
    type: ufs
    size: 137438953472
    sector-size: 4096
    write-protect-boundary: 0
    grow-last-partition: true
    luns:
      - lun: 0              # last partition (rootfs) grows
        partitions:
          - include: _common/kodiak-hlos.yaml
      - lun: 1
        grow: false
        partitions:
          - include: _common/kodiak-xbl.yaml
      - lun: 2
        grow: false
        partitions:
          - include: _common/kodiak-xbl.yaml
      - lun: 3
        grow: false
        partitions:
          - {name: ALIGN_TO_128K_1, size: "104KB", type-guid: "FDE1604B-D68B-4BD4-973D-962AE7A1ED88"}
          - include: _common/kodiak-cdt.yaml
          - include: _common/kodiak-ddr.yaml
      - lun: 4
        grow: false
        partitions:
          - include: _common/kodiak-firmware.yaml
      - lun: 5
        grow: false
        partitions:
          - include: _common/kodiak-modem.yaml
          - include: _common/kodiak-persist.yaml
  - id: emmc
    type: emmc
    size: 137438953472
    sector-size: 512
    write-protect-boundary: 65536
    grow-last-partition: true
    phys-parts:
      - phys-part: 0        # last partition (rootfs) grows
        partitions:
          - include: _common/kodiak-xbl.yaml
          - include: _common/kodiak-ddr.yaml
          - include: _common/kodiak-firmware.yaml
          - include: _common/kodiak-modem.yaml
          - include: _common/kodiak-persist.yaml
          - include: _common/kodiak-hlos.yaml
          - {name: rootfs, size: "10485760KB"}
      - phys-part: 1
        grow: false
        partitions:
          - include: _common/kodiak-cdt.yaml
          - {name: cdt, size: "4KB"}
