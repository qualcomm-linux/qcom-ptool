# Uses the shared qrb2210 eMMC layout from _common/qrb2210-abl-emmc.yaml.
platform:
  name: qrb2210-rb1-abl

storage:
  - id: emmc
    type: emmc
    size: 76841669632
    sector-size: 512
    write-protect-boundary: 65536
    grow-last-partition: true
    includes: [_common/qrb2210-abl-emmc.yaml]
