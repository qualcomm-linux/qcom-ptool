#
# Composes the shared qcs8275 partition sets from _common/ into the
# per-LUN UFS layout.
platform:
  name: iq-8275-evk

storage:
  - id: ufs
    type: ufs
    size: 76841669632
    sector-size: 4096
    write-protect-boundary: 0
    grow-last-partition: true
    luns:
      - lun: 0              # last partition (rootfs) grows
        partitions:
          - include: _common/qcs8275-hlos.yaml
      - lun: 1
        grow: false
        partitions:
          - include: _common/qcs8275-xbl.yaml
      - lun: 2
        grow: false
        partitions:
          - include: _common/qcs8275-xbl.yaml
      - lun: 3
        grow: false
        partitions:
          - {name: ALIGN_TO_128K_1, size: "104KB", type-guid: "FDE1604B-D68B-4BD4-973D-962AE7A1ED88"}
          - include: _common/qcs8275-cdt.yaml
          - include: _common/qcs8275-ddr.yaml
      - lun: 4
        grow: false
        partitions:
          - include: _common/qcs8275-firmware.yaml
      - lun: 5
        grow: false
        partitions:
          - include: _common/qcs8275-persist.yaml
