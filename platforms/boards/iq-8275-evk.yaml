#
# One physical board, two alternative boot-storage flavors on the
# Monaco layouts. The board contributes the storage geometry.
platform:
  name: iq-8275-evk

storage:
  - id: ufs
    size: 76841669632
    sector-size: 4096
    write-protect-boundary: 0
    grow-last-partition: true
  - id: emmc
    size: 76841669632
    sector-size: 512
    write-protect-boundary: 65536
    grow-last-partition: true

flavors:
  - layout: flavors/monaco-ufs.yaml
  - layout: flavors/monaco-emmc.yaml
    name: iq-8275-evk-emmc
