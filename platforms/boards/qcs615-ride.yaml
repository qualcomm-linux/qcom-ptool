#
# One physical board, two alternative boot-storage flavors on the Talos
# layouts; identical to iq-615-evk except for the eMMC cdt boot area,
# which this board does not carry.
platform:
  name: qcs615-ride

storage:
  - id: ufs
    size: 76841669632
    sector-size: 4096
    write-protect-boundary: 0
    grow-last-partition: true
  - id: emmc
    size: 76841669632
    sector-size: 512
    write-protect-boundary: 65536
    grow-last-partition: true

contents:
  product-name: QCS615.LE.0.0
  hlos-type: LE
  chip: QCS615
  additional-chipids: [SA6155]
  common:
    - device-programmer: {file: prog_firehose_ddr.elf}
    - device-programmer: {file: prog_firehose_lite.elf, attributes: {firehose_type: "lite"}}

flavors:
  - layout: flavors/talos-ufs.yaml
  - layout: flavors/talos-emmc.yaml
    name: qcs615-ride-emmc
