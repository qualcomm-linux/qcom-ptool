#
# Single-flavor board on the Monaco eMMC layout; identical to
# iq-8275-evk's eMMC flavor on a smaller eMMC part.
platform:
  name: qcs8275-monza

storage:
  - id: emmc
    size: 63652757504
    sector-size: 512
    write-protect-boundary: 65536
    grow-last-partition: true

flavors:
  - layout: flavors/monaco-emmc.yaml
