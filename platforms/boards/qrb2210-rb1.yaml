#
# One physical board, two boot-firmware flavors on the shared qrb2210
# eMMC layouts: edk2 (default) and pre-edk2 ABL.
platform:
  name: qrb2210-rb1

storage:
  - id: emmc
    size: 76841669632
    sector-size: 512
    write-protect-boundary: 65536
    grow-last-partition: true

contents:
  product-name: QRB2210.LE.0.0
  hlos-type: LE
  chip: QRB2210
  common:
    - device-programmer: {file: prog_firehose_ddr.elf}
    - device-programmer: {file: prog_firehose_lite.elf, attributes: {firehose_type: "lite"}}

flavors:
  - layout: flavors/qrb2210-emmc.yaml
  - layout: flavors/qrb2210-abl-emmc.yaml
    name: qrb2210-rb1-abl
