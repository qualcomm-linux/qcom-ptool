storage:
  - id: emmc
    type: emmc
    size: 76841669632            # 75040693 KiB
    sector-size: 512
    write-protect-boundary: 65536

# SoC part of contents.xml: chip identity and boot-chain firmware.
contents:
  chip: Eliza
  chipset: ELIZA
  additional-chipids: [CQ7790S]
  common:
    - device-programmer: {file: xbl_s_devprg_ns.melf, attributes: {cmm_file_var: "FIREHOSE_DDR_ELF"}}
    - device-programmer: {file: xbl_s_devprg_ns.melf, attributes: {firehose_type: "lite"}}
