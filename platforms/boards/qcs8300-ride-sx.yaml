#
# Single-flavor board on the Monaco per-LUN UFS layout; identical to
# iq-8275-evk's UFS flavor.
platform:
  name: qcs8300-ride-sx

storage:
  - id: ufs
    size: 76841669632
    sector-size: 4096
    write-protect-boundary: 0
    grow-last-partition: true

flavors:
  - layout: flavors/monaco-ufs.yaml
