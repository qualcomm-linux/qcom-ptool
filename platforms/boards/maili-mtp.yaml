    - download: {file: signed_firmware_soc_view.elf, attributes: {qsahara_image_id: "60"}}
    - download: {file: sequencer_ram.elf, attributes: {qsahara_image_id: "59"}}
    - download: {file: xbl_sc.elf, attributes: {qsahara_image_id: "21"}}
    - download: {file: multi_image_qti.mbn, attributes: {qsahara_image_id: "36"}}
    - download: {file: multi_image.mbn, attributes: {qsahara_image_id: "37"}}
    - device-programmer: {file: device_programmer_ddr.elf, attributes: {cmm_file_var: "DEV_PRG", qsahara_image_id: "13"}}
    - device-programmer: {file: xbl_config_devprg.elf, path: '.\', attributes: {cmm_file_var: "XBL_CFG", qsahara_image_id: "38"}}
