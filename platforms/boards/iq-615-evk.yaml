#
# One physical board, two alternative boot-storage flavors on the Talos
# layouts. The eMMC flavor adds the board's cdt boot area (phys-part 1)
# as an in-place override.
platform:
  name: iq-615-evk

storage:
  - id: ufs
    size: 76841669632
    sector-size: 4096
    write-protect-boundary: 0
    grow-last-partition: true
  - id: emmc
    size: 76841669632
    sector-size: 512
    write-protect-boundary: 65536
    grow-last-partition: true

contents:
  product-name: QCS615.LE.0.0
  hlos-type: LE
  chip: QCS615
  additional-chipids: [SA6155]
  common:
    - device-programmer: {file: prog_firehose_ddr.elf}
    - device-programmer: {file: prog_firehose_lite.elf, attributes: {firehose_type: "lite"}}

flavors:
  - layout: flavors/talos-ufs.yaml
  - layout: flavors/talos-emmc.yaml
    name: iq-615-evk-emmc
    storage:
      - id: emmc
        phys-parts:
          - phys-part: 1
            grow: false
            partitions:
              - {name: cdt, size: "4KB", type-guid: "A19F205F-CCD8-4B6D-8F1E-2D9BC24CFFB1", filename: cdt.bin}
