#
# Glymur-CRD: NVMe (HLOS) + SPI-NOR (boot / platform-config).
# Partition order matches the legacy .conf files (order determines GPT offsets).
platform:
  name: glymur-crd

storage:
  - id: nvme
    type: nvme
    size: 68719476736            # 64 GiB
    sector-size: 512
    write-protect-boundary: 65536
    grow-last-partition: true
    partitions:
      - include: _common/glymur-hlos.yaml

  - id: spinor
    type: spinor
    size: 67108864               # 64 MiB
    sector-size: 4096
    write-protect-boundary: 0
    partitions:
      - include: _common/glymur-spinor.yaml
