#
# Lemans-family eMMC layout: user area (phys-part 0) plus the cdt boot
# area (phys-part 1), composed from the shared partition sets under
# _common/ (which alias the Monaco sets until the families deviate).
# Matches monaco-emmc with the Lemans partition sets.
storage:
  - type: emmc
    grow-last-partition: true
    phys-parts:
      - phys-part: 0        # last partition (rootfs) grows
        partitions:
          - include: _common/lemans-xbl.yaml
          - include: _common/lemans-ddr.yaml
          - include: _common/lemans-firmware.yaml
          - {name: core_nhlos_a, size: "174080KB", type-guid: "6690B4CE-70E9-4817-B9F1-25D64D888357"}
          - {name: core_nhlos_b, size: "174080KB", type-guid: "77036CD4-03D5-42BB-8ED1-37E5A88BAA34"}
          - {name: cateloader, size: "2048KB", type-guid: "AA9A5C4C-4F1F-7D3A-014A-22BD33BF7191"}
          - {name: uefivarstore, size: "512KB", type-guid: "165BD6BC-9250-4AC8-95A7-A93F4A440066"}
          - {name: quantumsdk, size: "40960KB", type-guid: "AA9A5C4C-4F1F-7D3A-014A-22BD33BF7191"}
          - {name: quantumfv, size: "512KB", type-guid: "80C23C26-C3F9-4A19-BB38-1E457DACEB09"}
          - include: _common/lemans-persist.yaml
          - include: _common/lemans-hlos.yaml
      - phys-part: 1
        grow: false
        partitions:
          - include: _common/lemans-cdt.yaml
