#
# Shikra eMMC layout: user area (phys-part 0) plus CDT boot area (phys-part 1).
storage:
  - type: emmc
    grow-last-partition: true
    phys-parts:
      - phys-part: 0
        partitions:
          - include: _common/shikra-firmware.yaml
          - include: _common/shikra-hlos.yaml
      - phys-part: 1
        grow: false
        partitions:
          - include: _common/shikra-cdt.yaml
