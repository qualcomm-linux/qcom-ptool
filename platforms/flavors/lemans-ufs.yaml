#
# Lemans-family per-LUN UFS layout, composed from the shared partition
# sets under _common/ (which alias the Monaco sets until the families
# deviate). Differs from monaco-ufs only in the rootfs size, overridden
# in place.
storage:
  - id: ufs
    type: ufs
    luns:
      - lun: 0              # last partition (rootfs) grows
        partitions:
          - include: _common/lemans-hlos.yaml
          - {name: rootfs, size: "29390848KB"}
      - lun: 1
        grow: false
        partitions:
          - include: _common/lemans-xbl.yaml
      - lun: 2
        grow: false
        partitions:
          - include: _common/lemans-xbl.yaml
      - lun: 3
        grow: false
        partitions:
          - {name: ALIGN_TO_128K_1, size: "104KB", type-guid: "FDE1604B-D68B-4BD4-973D-962AE7A1ED88"}
          - include: _common/lemans-cdt.yaml
          - include: _common/lemans-ddr.yaml
      - lun: 4
        grow: false
        partitions:
          - include: _common/lemans-firmware.yaml
      - lun: 5
        grow: false
        partitions:
          - include: _common/lemans-persist.yaml
