#
# Glymur: UFS (HLOS) + SPI-NOR (boot / platform-config).
storage:
  - type: spinor
    partitions:
      - include: firmware/glymur-spinor.yaml

  - type: ufs
    grow-last-partition: true
    luns:
      - lun: 0
        partitions:
          - include: hlos/glymur-hlos.yaml
