#
# Monaco-family per-LUN UFS layout, composed from the shared partition
# sets under _common/.
storage:
  - id: ufs
    type: ufs
    luns:
      - lun: 0              # last partition (rootfs) grows
        partitions:
          - include: _common/monaco-hlos.yaml
      - lun: 1
        grow: false
        partitions:
          - include: _common/monaco-xbl.yaml
      - lun: 2
        grow: false
        partitions:
          - include: _common/monaco-xbl.yaml
      - lun: 3
        grow: false
        partitions:
          - {name: ALIGN_TO_128K_1, size: "104KB", type-guid: "FDE1604B-D68B-4BD4-973D-962AE7A1ED88"}
          - include: _common/monaco-cdt.yaml
          - include: _common/monaco-ddr.yaml
      - lun: 4
        grow: false
        partitions:
          - include: _common/monaco-firmware.yaml
      - lun: 5
        grow: false
        partitions:
          - include: _common/monaco-persist.yaml
