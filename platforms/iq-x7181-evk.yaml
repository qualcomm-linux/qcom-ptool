board: boards/iq-x7181-evk.yaml

# The ub_qcom_server product flavor flashes the prebuilt server image
# from the parent directory onto UFS in a second flash phase.
contents:
  product-name: Hamoa_IOT.UBUN.1.0
  hlos-type: LE
  location: spinor
  default-components: [common]
  product-flavors:
    - {name: ub_qcom_server, components: [apps, common]}
  chipids:
    - {flavor: ub_qcom_server, storage: UFS, flash-phase: 2}
  apps-image-dir: build
  common:
    - download: {file: efi.bin, path: '../', path-flavor: ub_qcom_server, attributes: {storage_type: "ufs", fastboot_complete: "efi"}}
    - download: {file: rootfs.img, path: '../', path-flavor: ub_qcom_server, attributes: {storage_type: "ufs", fastboot_complete: "rootfs"}}
    - download: {file: gpt_main0.bin, path: '../', path-flavor: ub_qcom_server, attributes: {storage_type: "ufs", flavor: "ub_qcom_server"}}
    - download: {file: gpt_backup0.bin, path: '../', path-flavor: ub_qcom_server, attributes: {storage_type: "ufs", flavor: "ub_qcom_server"}}
    - partition: {file: rawprogram0.xml, path: '../', path-flavor: ub_qcom_server, attributes: {storage_type: "ufs", flavor: "ub_qcom_server"}}
    - patch: {file: patch0.xml, path: '../', path-flavor: ub_qcom_server, attributes: {storage_type: "ufs", flavor: "ub_qcom_server"}}

flavors:
  - flavors/iq-x7181-nvme-spinor-ufs.yaml
