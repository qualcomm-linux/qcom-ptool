board: boards/nord-rrd.yaml

# Flashed over sahara EDL; the sail_nor product flavor also flashes the
# prebuilt SAIL firmware from ./spinor onto SPI-NOR in a second phase.
contents:
  product-name: Nord_IOT.LE.0.0
  hlos-type: LE
  location: ufs
  product-flavors:
    - {name: sail_nor, components: [common]}
  chipids:
    - {flavor: sail_nor, storage: spinor, flash-phase: 2}
  common:
    - download: {file: rtsshyp.elf, path: './spinor', path-flavor: sail_nor, attributes: {storage_type: "spinor", fastboot_complete: "RTSS_HYP"}}
    - download: {file: sail_nor_dlp.bin, path: './spinor', path-flavor: sail_nor, attributes: {storage_type: "spinor", fastboot_complete: "RTSS_DLP"}}
    - download: {file: rtsssw1.elf, path: './spinor', path-flavor: sail_nor, attributes: {storage_type: "spinor", fastboot_complete: "RTSS_SW1"}}
    - download: {file: rtsssw2.elf, path: './spinor', path-flavor: sail_nor, attributes: {storage_type: "spinor", fastboot_complete: "RTSS_SW2"}}
    - download: {file: rtsssw3.elf, path: './spinor', path-flavor: sail_nor, attributes: {storage_type: "spinor", fastboot_complete: "RTSS_SW3"}}
    - download: {file: rtsssw4.elf, path: './spinor', path-flavor: sail_nor, attributes: {storage_type: "spinor", fastboot_complete: "RTSS_SW4"}}
    - download: {file: rtsssw5.elf, path: './spinor', path-flavor: sail_nor, attributes: {storage_type: "spinor", fastboot_complete: "RTSS_SW5"}}
    - download: {file: rtsssw6.elf, path: './spinor', path-flavor: sail_nor, attributes: {storage_type: "spinor", fastboot_complete: "RTSS_SW6"}}
    - download: {file: gpt_main0.bin, path: './spinor', path-flavor: sail_nor, attributes: {storage_type: "spinor", flavor: "sail_nor"}}
    - download: {file: gpt_backup0.bin, path: './spinor', path-flavor: sail_nor, attributes: {storage_type: "spinor", flavor: "sail_nor"}}
    - partition: {file: rawprogram0.xml, path: './spinor', path-flavor: sail_nor, attributes: {storage_type: "spinor", flavor: "sail_nor"}}
    - patch: {file: patch0.xml, path: './spinor', path-flavor: sail_nor, attributes: {storage_type: "spinor", flavor: "sail_nor"}}

flavors:
  - flavors/nord-spinor-ufs.yaml
